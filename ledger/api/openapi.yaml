openapi: 3.0.3
info:
  title: Ledger API
  version: 0.1.0
  description: HTTP API for the ledger service.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check whether the service is running
      responses:
        "200":
          description: The service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ledgers/{slug}/accounts:
    post:
      operationId: createPayableAccount
      summary: Create a payable account in a ledger
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LedgerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayableAccountRequest"
      responses:
        "200":
          description: An identical request was previously completed; the existing account is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePayableAccountResponse"
        "201":
          description: The payable account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePayableAccountResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: The requested ledger does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Ledger not found.
                error:
                  code: ledger_not_found
        "409":
          description: The request conflicts with the ledger's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ledgerClosed:
                  summary: The ledger is closed
                  value:
                    message: Ledger is closed.
                    error:
                      code: ledger_closed
                holderConflict:
                  summary: The holder identity conflicts with an existing holder
                  value:
                    message: Holder information conflicts with an existing holder.
                    error:
                      code: holder_conflict
        "500":
          description: The server could not complete the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: The server could not complete the request.
                error:
                  code: internal_server_error

  /ledgers/{slug}/accounts/{account_ref}:
    get:
      operationId: getAccount
      summary: Get a payable account and its balance
      description: Retrieves one payable account and exposes both its derived available amount and its underlying ledger counters. This API does not expose internal cash or revenue accounts.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LedgerSlug"
        - name: account_ref
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccountRef"
      responses:
        "200":
          description: The payable account was found and returned with its balances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: The requested ledger or payable account does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ledgerNotFound:
                  summary: The ledger does not exist
                  value:
                    message: Ledger not found.
                    error:
                      code: ledger_not_found
                accountNotFound:
                  summary: The payable account does not exist in the ledger
                  value:
                    message: Account not found.
                    error:
                      code: account_not_found
        "500":
          description: The server could not complete the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: The server could not complete the request.
                error:
                  code: internal_server_error

  /ledgers/{slug}/entries:
    post:
      operationId: postJournalEntry
      summary: Post a journal entry to a ledger
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LedgerSlug"
        - name: Idempotency-Key
          in: header
          required: true
          description: Caller-generated key that uniquely identifies this posting within the ledger.
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostJournalEntryRequest"
      responses:
        "200":
          description: An identical request was previously completed; the existing entry is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostJournalEntryResponse"
        "201":
          description: The journal entry was posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostJournalEntryResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: The ledger or one of the referenced accounts does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ledgerNotFound:
                  summary: The ledger does not exist
                  value:
                    message: Ledger not found.
                    error:
                      code: ledger_not_found
                accountNotFound:
                  summary: A referenced account does not exist in the ledger
                  value:
                    message: Account not found.
                    error:
                      code: account_not_found
        "409":
          description: The posting conflicts with existing ledger state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ledgerClosed:
                  summary: The ledger is closed
                  value:
                    message: Ledger is closed.
                    error:
                      code: ledger_closed
                accountClosed:
                  summary: A referenced account is closed
                  value:
                    message: Account is closed.
                    error:
                      code: account_closed
                insufficientFunds:
                  summary: An account balance restriction would be exceeded
                  value:
                    message: Insufficient funds.
                    error:
                      code: insufficient_funds
                idempotencyConflict:
                  summary: The idempotency key was previously used for different content
                  value:
                    message: Idempotency key conflicts with a previous request.
                    error:
                      code: idempotency_conflict
        "500":
          description: The server could not complete the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: The server could not complete the request.
                error:
                  code: internal_server_error

components:
  schemas:
    LedgerSlug:
      type: string
      description: Opaque identifier assigned to the ledger.
      minLength: 3
      maxLength: 63
      pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
      example: ngn_ng
      x-validation-messages:
        minLength: must contain at least 3 characters
        maxLength: must not exceed 63 characters
        pattern: must contain lowercase letters and numbers separated by single underscores

    HolderRef:
      type: string
      description: Stable opaque reference assigned to a holder by the ledger.
      minLength: 1
      maxLength: 64
      example: hld_01K33YVADP5Z8B0T3X2Q91C6RH

    AccountRef:
      type: string
      description: Stable opaque reference assigned to an account by the ledger.
      minLength: 1
      maxLength: 64
      example: acct_01K33YV8M82N9MXP4E7J6B1QWK

    JournalRef:
      type: string
      description: Stable opaque reference assigned to a journal entry by the ledger.
      minLength: 1
      maxLength: 64
      example: jrn_01K33YW0MDHJ9E4N7Z2QPV6R8K

    IdempotencyKey:
      type: string
      description: Caller-generated identifier used to make a ledger operation idempotent.
      minLength: 1
      maxLength: 255
      pattern: '.*\S.*'
      example: payment_123
      x-validation-messages:
        type: must be a string
        minLength: must not be empty
        maxLength: must not exceed 255 characters
        pattern: must not be blank

    JournalEntryKind:
      type: string
      description: Business classification of a journal entry.
      enum:
        - payment
        - settlement
        - transfer
      x-validation-messages:
        enum: "must be one of: payment, settlement, transfer"

    PostJournalEntryRequest:
      type: object
      required:
        - kind
        - lines
      properties:
        kind:
          $ref: "#/components/schemas/JournalEntryKind"
        description:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          x-validation-messages:
            type: must be a string
            minLength: must not be empty
            maxLength: must not exceed 500 characters
            pattern: must not be blank
        effective_at:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/PostJournalEntryLine"
          x-validation-messages:
            type: must be an array
            minItems: must contain at least one journal line
            maxItems: must not contain more than 100 journal lines

    PostJournalEntryLine:
      type: object
      required:
        - debit_account_ref
        - credit_account_ref
        - amount
      properties:
        debit_account_ref:
          $ref: "#/components/schemas/AccountRef"
        credit_account_ref:
          $ref: "#/components/schemas/AccountRef"
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Positive amount expressed in the ledger's minor units.
          example: 10000
          x-validation-messages:
            type: must be an integer
            minimum: must be greater than zero
            maximum: must not exceed the maximum supported amount

    PostJournalEntryResponse:
      type: object
      additionalProperties: false
      required:
        - journal_ref
        - ledger_slug
        - kind
        - state
        - effective_at
        - created_at
      properties:
        journal_ref:
          $ref: "#/components/schemas/JournalRef"
        ledger_slug:
          $ref: "#/components/schemas/LedgerSlug"
        kind:
          $ref: "#/components/schemas/JournalEntryKind"
        state:
          type: string
          enum:
            - posted
        description:
          type: string
          minLength: 1
        effective_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    CreatePayableAccountRequest:
      type: object
      required:
        - external_id
        - name
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          x-go-name: ExternalID
          x-validation-messages:
            type: must be a string
            minLength: must not be empty
            maxLength: must not exceed 255 characters
            pattern: must not be blank
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          x-validation-messages:
            type: must be a string
            minLength: must not be empty
            maxLength: must not exceed 255 characters
            pattern: must not be blank

    CreatePayableAccountResponse:
      type: object
      additionalProperties: false
      required:
        - holder_ref
        - account_ref
        - ledger_slug
        - external_id
        - name
        - created_at
      properties:
        holder_ref:
          $ref: "#/components/schemas/HolderRef"
        account_ref:
          $ref: "#/components/schemas/AccountRef"
        ledger_slug:
          $ref: "#/components/schemas/LedgerSlug"
        external_id:
          type: string
          minLength: 1
          example: merchant_123
          x-go-name: ExternalID
        name:
          type: string
          minLength: 1
          example: Acme Ltd
        created_at:
          type: string
          format: date-time

    GetAccountResponse:
      type: object
      additionalProperties: false
      required:
        - account_ref
        - ledger_slug
        - kind
        - available
        - balances
        - created_at
      properties:
        account_ref:
          $ref: "#/components/schemas/AccountRef"
        ledger_slug:
          $ref: "#/components/schemas/LedgerSlug"
        kind:
          type: string
          enum:
            - payable
          example: payable
        available:
          type: integer
          format: int64
          minimum: 0
          description: Derived available amount in minor units (credits_posted - debits_posted - debits_pending).
          example: 9800
        balances:
          $ref: "#/components/schemas/AccountBalances"
        created_at:
          type: string
          format: date-time
      example:
        account_ref: acct_01K33YV8M82N9MXP4E7J6B1QWK
        ledger_slug: ngn_ng
        kind: payable
        available: 9800
        balances:
          debits_pending: 200
          credits_pending: 0
          debits_posted: 0
          credits_posted: 10000
        created_at: "2026-09-08T10:30:00Z"

    AccountBalances:
      type: object
      additionalProperties: false
      required:
        - debits_pending
        - credits_pending
        - debits_posted
        - credits_posted
      properties:
        debits_pending:
          type: integer
          format: int64
          minimum: 0
          description: Total pending debit amount in minor units.
          example: 200
        credits_pending:
          type: integer
          format: int64
          minimum: 0
          description: Total pending credit amount in minor units.
          example: 0
        debits_posted:
          type: integer
          format: int64
          minimum: 0
          description: Total posted debit amount in minor units.
          example: 0
        credits_posted:
          type: integer
          format: int64
          minimum: 0
          description: Total posted credit amount in minor units.
          example: 10000

    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - error
      properties:
        message:
          type: string
          minLength: 1
          example: Request validation failed.
        error:
          $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      additionalProperties: false
      required:
        - code
        - details
      properties:
        code:
          type: string
          enum:
            - validation_error
        details:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"

    ValidationErrorDetail:
      type: object
      additionalProperties: false
      required:
        - location
        - field
        - code
        - message
      properties:
        location:
          type: string
          enum:
             - request
             - path
             - query
             - header
             - body
        field:
          type: string
          minLength: 1
          example: external_id
        code:
          type: string
          enum:
            - required
            - invalid_type
            - invalid_format
            - invalid_value
            - min_length
            - max_length
            - unknown_field
        message:
          type: string
          minLength: 1
          example: external_id is required

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - error
      properties:
        message:
          type: string
          minLength: 1
        error:
          $ref: "#/components/schemas/ErrorInfo"

    ErrorInfo:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"

    ErrorCode:
      type: string
      enum:
        - ledger_not_found
        - ledger_closed
        - holder_conflict
        - account_not_found
        - account_closed
        - insufficient_funds
        - idempotency_conflict
        - internal_server_error

  responses:
    InvalidRequest:
      description: The request does not satisfy the API contract.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
